workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - apple_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.thep.budgeting
      vars:
        BUNDLE_ID: com.thep.budgeting
      node: 18
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prepare web assets
        script: |
          mkdir -p www
          cp index.html www/
      - name: Add iOS platform
        script: npx cap add ios
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set iOS deployment target to 15
        script: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/App/App.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" ios/App/App/Info.plist 2>/dev/null || true
      - name: Enable iPad support
        script: |
          /usr/libexec/PlistBuddy -c "Delete :UIDeviceFamily" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:1 integer 2" ios/App/App/Info.plist
      - name: Replace app icons
        script: |
          ICON_DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          rm -f "$ICON_DEST"/*.png "$ICON_DEST/Contents.json"
          cp assets/icons/ios/*.png "$ICON_DEST/"
          cp assets/icons/ios/Contents.json "$ICON_DEST/"
          echo "App icons replaced successfully"
      - name: Update version
        script: |
          BUILD_NUM=$(date +%Y%m%d%H%M)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" ios/App/App/Info.plist
      - name: Pod install
        script: cd ios/App && pod install
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS app
        script: xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
