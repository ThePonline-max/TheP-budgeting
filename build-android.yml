name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Replace app icons
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "assets/icons/android/mipmap-${density}.png" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            # Also copy to round icon
            cp "assets/icons/android/mipmap-${density}.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
          # Copy adaptive foreground if folder exists
          if [ -d "android/app/src/main/res/mipmap-xxxhdpi" ]; then
            cp "assets/icons/android/ic_launcher_foreground.png" "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png" 2>/dev/null || true
          fi
          echo "Android icons replaced successfully"

      - name: Update target SDK and version code
        run: |
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = 35/" android/variables.gradle
          sed -i "s/versionCode 1/versionCode 4/" android/app/build.gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release AAB
        run: cd android && ./gradlew bundleRelease

      - name: Sign AAB
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore keystore.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "${{ secrets.KEY_ALIAS }}"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
